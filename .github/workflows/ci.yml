name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.mjs

      - name: Smoke test (server starts and serves the UI without a real API key)
        run: |
          MISTRAL_API_KEY=dummy PORT=3100 node server.mjs &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/ > /dev/null 2>&1; then
              echo "Server is up"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not start in time"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
