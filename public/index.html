<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voyage nordique</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { color: #0b3954; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    legend { font-weight: 600; padding: 0 0.5rem; }
    label { display: block; margin: 0.5rem 0 0.25rem; font-weight: 500; }
    input, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .pays { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .pays label { display: flex; align-items: center; gap: 0.35rem; font-weight: 400; }
    button { margin-top: 0.5rem; padding: 0.6rem 1.5rem; border: none; border-radius: 6px; background: #0b3954; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #ccc; cursor: default; }
    pre { background: #f1f3f4; border-radius: 8px; padding: 1rem; white-space: pre-wrap; font-family: inherit; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Planificateur de voyage nordique</h1>
  <form id="form">
    <fieldset>
      <legend>Pays visités</legend>
      <div class="pays">
        <label><input type="checkbox" name="pays" value="Danemark" /> Danemark</label>
        <label><input type="checkbox" name="pays" value="Suède" /> Suède</label>
        <label><input type="checkbox" name="pays" value="Norvège" /> Norvège</label>
        <label><input type="checkbox" name="pays" value="Finlande" /> Finlande</label>
        <label><input type="checkbox" name="pays" value="Islande" /> Islande</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Détails</legend>
      <label for="jours">Durée (jours)</label>
      <input type="number" id="jours" name="jours" min="1" max="60" value="7" required />
      <label for="budget">Budget</label>
      <select id="budget" name="budget">
        <option value="petit budget (auberges, transports publics)">Petit budget</option>
        <option value="modéré" selected>Modéré</option>
        <option value="confort (bons hôtels, expériences premium)">Confort</option>
      </select>
      <label for="interets">Centres d'intérêt (optionnel)</label>
      <input type="text" id="interets" name="interets" placeholder="ex : aurores boréales, fjords, design, gastronomie" />
    </fieldset>
    <button type="submit" id="submit">Générer l'itinéraire</button>
  </form>
  <pre id="result" class="hidden"></pre>
  <script>
    const form = document.getElementById("form");
    const button = document.getElementById("submit");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pays = [...form.querySelectorAll('input[name="pays"]:checked')].map((c) => c.value);
      if (pays.length === 0) { alert("Sélectionnez au moins un pays."); return; }
      button.disabled = true;
      result.classList.remove("hidden");
      result.textContent = "";
      try {
        const res = await fetch("/api/itinerary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pays,
            jours: Number(document.getElementById("jours").value),
            budget: document.getElementById("budget").value,
            interets: document.getElementById("interets").value.trim(),
          }),
        });
        if (!res.ok || !res.body) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "Erreur serveur.");
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split("\n\n");
          buffer = events.pop();
          for (const event of events) {
            const line = event.trim();
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6);
            if (payload === "[DONE]") continue;
            const { content, error } = JSON.parse(payload);
            if (error) throw new Error(error);
            result.textContent += content;
            result.scrollTop = result.scrollHeight;
          }
        }
      } catch (err) {
        result.textContent += (result.textContent ? "\n\n" : "") + "Erreur : " + err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
